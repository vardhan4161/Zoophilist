services:
  - type: web
    name: zoophilist
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm run render:build
    startCommand: pnpm run render:start
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: RESEND_MODE
        value: production
      - key: RESEND_MONTHLY_LIMIT
        value: "1000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_SENDER_ID
        sync: false
      - key: FAST2SMS_TEMPLATE_ID
        sync: false
      - key: FAST2SMS_VARIABLES
        sync: false
