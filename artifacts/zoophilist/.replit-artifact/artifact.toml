kind = "web"
previewPath = "/"
title = "Zoophilist"
version = "1.0.0"
id = "artifacts/zoophilist"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21705

[services.development]
run = "pnpm --filter @workspace/zoophilist run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zoophilist", "run", "build" ]
serve = "static"
publicDir = "artifacts/zoophilist/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21705"
BASE_PATH = "/"
